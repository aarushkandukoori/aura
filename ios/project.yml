# XcodeGen spec for the Aura iPhone app.
# Regenerate the Xcode project after adding or removing files:  cd ios && xcodegen generate
# Every .swift file under Aura/ is picked up automatically (folders become groups).

name: Aura

options:
  bundleIdPrefix: com.aarushkandukoori
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Swift 5 language mode with minimal concurrency checking keeps the code simple to read.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Aura:
    type: application
    platform: iOS
    sources:
      - path: Aura
    # XcodeGen writes this Info.plist from the properties below every time it runs.
    info:
      path: Aura/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aura
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The Aura server runs on this Mac (or this Wi-Fi) over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: Aura opens your photo library so you can share photos and videos.
        NSCameraUsageDescription: Aura uses the camera so you can take photos and videos to share.
        NSLocalNetworkUsageDescription: Aura connects to your Aura server on this network.
        # aura://profile/<username>, aura://tag/<tag>, aura://messages/<id> ... open screens in the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.aarushkandukoori.aura
            CFBundleURLSchemes:
              - aura
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarushkandukoori.aura
        PRODUCT_NAME: Aura
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # No signing for the Simulator. To run on a real iPhone, pick your team in Xcode.
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    scheme: {}
